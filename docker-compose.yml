---
# docker-base — Traefik reverse proxy
#
# This compose file runs a single Traefik instance that:
#  - Listens on host ports 80 (HTTP) and 443 (HTTPS)
#  - Routes traffic to downstream projects via the shared traefik-net network
#  - Terminates TLS using locally-trusted mkcert certificates
#
# Downstream projects must NOT expose host ports. They only need to:
#  1. Join the traefik-net external network
#  2. Add traefik.enable=true and routing labels to their services

networks:
  traefik-net:
    name: ${TRAEFIK_NETWORK:-traefik-net}
    external: true

services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.6}
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Docker socket — read-only to minimise attack surface
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Static configuration
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # Dynamic configuration directory (hot-reloaded)
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      # Local TLS certificates (generated by `make certs`)
      - ./certs:/etc/traefik/certs:ro
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      # Traefik dashboard — accessible at https://traefik.local
      - "traefik.http.routers.dashboard.rule=Host(`traefik.local`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=secure-headers@file"
